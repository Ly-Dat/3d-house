 box(g,w,h,.08,x,y,z,frame);box(g,w-.14,h-.14,.05,x,y+.07,z+.04,warm);
 box(g,w*.2,h-.2,.03,x-w*.3,y+.1,z+.07,curt);box(g,w*.2,h-.2,.03,x+w*.3,y+.1,z+.07,curt);
